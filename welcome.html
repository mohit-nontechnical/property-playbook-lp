<!-- ===== Meta Pixel: fire the SUBSCRIBE conversion (CompleteRegistration) =====
     This page is set as beehiiv's "redirect after subscribe" URL. Same browser, same
     origin as the landing page, so it reads the stored creative_id + email from
     localStorage and attributes the subscribe to the exact ad. No Zapier, no beehiiv API. -->
<script>
  window.PP_PIXELS = ["1334124178654448", "951250319950462"];
  var ATTR = {}; var EMAIL = "";
  try { ATTR = JSON.parse(localStorage.getItem('pp_attr') || '{}'); } catch(e){}
  try { EMAIL = localStorage.getItem('pp_email') || ""; } catch(e){}
  // allow ?email= / ?utm_content= overrides if beehiiv appends them
  (function(){ var p = new URLSearchParams(location.search);
    if(p.get('email')) EMAIL = p.get('email');
    if(p.get('utm_content')) ATTR.creative_id = p.get('utm_content');
    if(p.get('utm_term')) ATTR.angle = p.get('utm_term');
    if(p.get('utm_campaign')) ATTR.campaign = p.get('utm_campaign');
  })();

  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');

  (PP_PIXELS||[]).forEach(function(id){ fbq('init', id, EMAIL ? { em: EMAIL } : undefined); });
  fbq('track', 'PageView');
  // THE subscribe conversion — attributed to the creative that drove it.
  fbq('track', 'CompleteRegistration', {
    content_name: ATTR.angle || 'general',
    creative_id: ATTR.creative_id || '',
    campaign: ATTR.campaign || '',
    status: 'subscribed'
  });
  // clear so a refresh doesn't double-fire
  try { localStorage.removeItem('pp_email'); } catch(e){}
</script>
<noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1334124178654448&ev=CompleteRegistration&noscript=1" alt="" /></noscript>

<style>
  :root{--ink:#16233a;--paper:#f6f1e7;--brass:#a9803f;--char:#272420;--mut:#6f675c;--line:#ddd2bd;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Hanken Grotesk',sans-serif;color:var(--char);background:var(--paper);
    display:grid;place-items:center;min-height:100vh;-webkit-font-smoothing:antialiased;padding:24px;}
  .card{max-width:520px;text-align:center;}
  .mark{display:inline-grid;place-items:center;width:48px;height:48px;background:var(--ink);color:var(--paper);
    font-family:'Newsreader',serif;font-weight:600;font-size:21px;border-radius:6px;margin-bottom:24px;}
  .check{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--brass);
    color:#fff;font-size:32px;margin:0 auto 22px;}
  h1{font-family:'Newsreader',serif;font-weight:500;font-size:clamp(30px,5vw,42px);line-height:1.08;
    color:var(--ink);letter-spacing:-.01em;margin:0 0 14px;}
  h1 em{font-style:italic;color:var(--brass);}
  p{font-size:18px;line-height:1.6;color:var(--mut);margin:0 0 28px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{font-family:inherit;font-weight:700;font-size:16px;padding:14px 24px;border-radius:4px;border:1px solid var(--line);}
  .btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.ghost{background:#fff;color:var(--char);}
  .fine{font-size:13px;color:#8b8478;margin-top:26px;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">PP</div>
    <div class="check">✓</div>
    <h1>You're in. Welcome to <em>Property Playbook.</em></h1>
    <p>The next overlooked-market breakdown lands in your inbox. Real numbers, the programs, and an honest take on the risks. No guru fluff.</p>
    <div class="btns">
      <a class="btn dark" href="https://propertyplaybook.beehiiv.com/archive">Read past issues</a>
      <a class="btn ghost" href="https://property-playbook-lp.vercel.app">Back to home</a>
    </div>
    <div class="fine">Not financial advice. Do your own due diligence on any deal.</div>
  </div>
</body>
